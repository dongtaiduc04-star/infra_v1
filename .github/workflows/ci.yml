name: Azure infrastructure checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Initialize and validate without remote state
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=azure init -backend=false -input=false -lockfile=readonly -no-color
          terraform -chdir=azure validate -no-color
  offline-tests:
    name: Offline SonarQube helper tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Run mocked startup tests
        shell: pwsh
        run: ./azure/tests/Test-SonarQubeStart.ps1
      - name: Check inactive shared-infrastructure preparation
        shell: pwsh
        run: ./azure/scripts/Test-SharedInfrastructurePreparation.ps1
